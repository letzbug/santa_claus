<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Christmas Door Magic</title><style>body{margin:0;background:radial-gradient(ellipse at 50% 20%,#244b67,#071723 75%);color:#fff;font-family:Georgia,serif;min-height:100vh;overflow:hidden;text-align:center}header{padding:7vh 1rem 0}h1{font-size:clamp(2.5rem,7vw,6rem);margin:.2em;text-shadow:0 0 30px #b9e5ff}p{font:1.1rem system-ui;color:#cde4ec}.moon{position:absolute;right:14%;top:13%;width:90px;height:90px;border-radius:50%;background:#f8f3d9;box-shadow:0 0 65px #c7e9ff}.mountains{position:absolute;bottom:0;width:100%;height:38%;background:linear-gradient(160deg,transparent 35%,#b5d4dd 36% 45%,transparent 46%),linear-gradient(25deg,transparent 35%,#d5e9ed 36% 52%,transparent 53%),linear-gradient(#234357,#102b3d);clip-path:polygon(0 65%,15% 25%,30% 66%,48% 10%,67% 70%,82% 30%,100% 65%,100% 100%,0 100%)}.house{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);font-size:clamp(90px,17vw,180px);filter:drop-shadow(0 0 25px #e3b866)}.snow{position:absolute;top:-20px;color:white;animation:fall linear infinite;pointer-events:none}@keyframes fall{to{transform:translateY(110vh)}}.panel{position:relative;z-index:3;margin:2rem auto;background:#081c2dc9;border:1px solid #b5d5e655;border-radius:22px;padding:1.2rem;max-width:470px;backdrop-filter:blur(8px)}button{background:#d9b96b;border:0;border-radius:40px;padding:12px 22px;font-weight:bold;cursor:pointer}input{accent-color:#d9b96b}small{display:block;margin-top:10px;color:#c5d8e1;font:13px system-ui}</style><div class="moon"></div><header><div style="font-size:3rem">❄️ 🎄 ❄️</div><h1>Christmas Magic</h1><p>Ein bisschen Weihnachtszauber bei jedem Besuch ✨</p></header><div class="panel"><p id="slot"></p><button id="test">🚪 Türöffnung testen</button><p>🔊 Lautstärke <input id="volume" type="range" min="0" max="100" value="65"></p><small id="status">Bereit · Musikdateien: music/a.mp3 bis e.mp3</small><small>Aktiv 07:00–17:00 · 20 Sekunden Pause zwischen Auslösungen</small></div><div class="mountains"></div><div class="house">🏠</div><script>
const tracks=[['07–09','a.mp3','Weihnachtsmorgen'],['09–11','b.mp3','Festliche Freude'],['11–13','c.mp3','Christmas Jazz'],['13–15','d.mp3','Winter Wonderland'],['15–17','e.mp3','Feierabendzauber']];let last=0,playing=null;const status=document.getElementById('status');function selected(){const h=new Date().getHours();return h>=7&&h<17?tracks[Math.floor((h-7)/2)]:null}function update(){const t=selected();document.getElementById('slot').textContent=t?`🎵 ${t[2]} · ${t[0]} Uhr`:'🌙 Außerhalb der Spielzeiten'}update();setInterval(update,60000);
function trigger(){const t=selected();if(!t){status.textContent='Außerhalb der Spielzeiten';return}if(Date.now()-last<20000){status.textContent='Pause aktiv – kein erneutes Abspielen';return}last=Date.now();if(playing){playing.pause();playing.currentTime=0}playing=new Audio('music/'+t[1]);playing.volume=+document.getElementById('volume').value/100;playing.play().then(()=>status.textContent='🎶 Jetzt spielt: '+t[2]).catch(()=>status.textContent='Audio blockiert oder Datei fehlt – einmal manuell testen');playing.onended=()=>status.textContent='Bereit für den nächsten Besucher'}document.getElementById('test').onclick=trigger;
// Local Mac bridge sends a custom event to this page; GitHub Pages cannot read USB directly.
window.addEventListener('door-open',trigger);for(let i=0;i<85;i++){let s=document.createElement('span');s.className='snow';s.textContent='❄';s.style.left=Math.random()*100+'%';s.style.fontSize=5+Math.random()*15+'px';s.style.opacity=.2+Math.random()*.7;s.style.animationDuration=5+Math.random()*12+'s';s.style.animationDelay=-Math.random()*18+'s';document.body.append(s)}
</script></html>
